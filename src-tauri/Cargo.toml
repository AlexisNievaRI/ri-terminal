[package]
name = "nova-term"
version = "0.2.0"
edition = "2021"

[lib]
name = "nova_term_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
base64 = "0.22"

[profile.release]
opt-level = "s"
lto = true
strip = true
